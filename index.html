<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    @font-face {
      font-family: 'Figtree';
      src: url(./assets/fonts/Figtree-VariableFont_wght.ttf) type(truetype);
      font-weight: 500 800;
    }
    .attribution { font-size: 0.6875rem; text-align: center; margin-top: 8px}
    .attribution a { color: hsl(228, 45%, 44%); }
    body {display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0; min-height: 100vh; background-color: #F4D04E}
    .card {display: flex; flex-direction: column; justify-content: center; border: 1px black solid; padding: 24px; max-width: 384px; width: 90%; box-sizing: border-box; box-shadow: 8px 8px 0 0 rgba(0, 0, 0, 1); background-color: white; border-radius: 20px;}
    img {border-radius: 10px;}
    .profile {display: flex; align-items: center; gap: 12px}
    .category {align-self: flex-start; background-color: #F4D04E; border-radius: 4px; padding: 4px 12px}
    .text {display: flex; flex-direction: column; margin-top: 24px; margin-bottom: 24px; gap: 12px}
    span, time, h1, p {font-family: 'Figtree'}
    span {font-weight: 800; font-size: 14px; line-height: 150%;}
    time {font-weight: 500; font-size: 14px; line-height: 150%;}
    h1 {margin: 0; font-weight: 800; font-size: 24px; line-height: 150%;}
    p {color: #6b6b6b; margin: 0; font-weight: 500; font-size: 16px; line-height: 150%;}
    .profile img {width: 32px; height: 32px;}
    h1:hover {color:#F4D04E; cursor: pointer;}
  </style>
</head>
<body>
  <div class="card">
    <img src="./assets/images/illustration-article.svg" alt="HTML/CSS Course Image"/>

    <div class="text">
      <span class="category">Learning</span>

      <time>Published 21 Dec 2023</time>

      <h1>HTML & CSS foundations</h1>

      <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>

    </div>
    <div class="profile">
      <img src="./assets/images/image-avatar.webp" alt="Greg profile picture"/>
      <span>Greg Hooper</span>
    </div>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Vivian Vu</a>.
  </footer>
</body>
</html>
